server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location /stream {
        proxy_pass http://agent_server:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }
    location /run {
        proxy_pass http://agent_server:8000;
    }
}